version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSRES_USER: efootball
      POSRES_PASSWORD: secret
      POSS_DB: efootball
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
