# Fly.io — конфиг для Go API + Telegram бот
app = "efootball-api"
primary_region = "ams"   # Amsterdam — ближайший к СНГ бесплатный регион

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # не останавливать машину (бот должен работать)
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  size = "shared-cpu-1x"   # бесплатный тариф
  memory = "256mb"

# Переменные окружения задаются через:
# fly secrets set BOT_TOKEN=xxx POSTGRES_DSN=xxx JWT_SECRET=xxx GOOGLE_CLIENT_ID=xxx FRONTEND_URL=https://xxx.vercel.app
