# Render Blueprint — деплой Go API + встроенный Next.js + Telegram бот.
# Один Docker-контейнер, один постоянный URL https://<name>.onrender.com
#
# Деплой: render.com → New → Blueprint → выбрать этот репозиторий.
# Render прочитает этот файл и спросит только секретные значения (sync: false).
services:
  - type: web
    name: efootball
    runtime: docker
    repo: https://github.com/iamabdynab1ev/efootball-bot
    branch: main
    region: frankfurt        # ближайший к СНГ бесплатный регион
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true         # git push → автоматический передеплой
    envVars:
      - key: APP_ENV
        value: production
      # Публичный @username бота — нужен для deep-link «Открыть Telegram бот»
      # (https://t.me/<username>?start=link_CODE). Не секрет.
      - key: BOT_USERNAME
        value: eFoot6all_bot
      # Web Push (VAPID). Публичный ключ — не секрет, отдаётся фронтенду.
      # Приватный ключ задаётся в дашборде (sync: false), в публичный репо нельзя.
      - key: VAPID_PUBLIC_KEY
        value: BJ3BCtp4TOqO3UDRTLUYon5QzegZ_4NXlo2s8qcFaRUA7A5DLZi0zsfrVceQM4c61tWt8d2xWt0y3EhpjErbxy8
      - key: VAPID_SUBJECT
        value: mailto:admin@efootleague.app
      - key: VAPID_PRIVATE_KEY
        sync: false
      # NEXT_PUBLIC_GOOGLE_CLIENT_ID — нужен на этапе СБОРКИ (встраивается в сайт).
      # Render передаёт env с совпадающим именем в ARG Dockerfile.
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: POSTGRES_DSN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
