<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="120" fill="#09090b"/>
  <!-- Trophy cup -->
  <g transform="translate(256,220)">
    <!-- Cup body -->
    <path d="M-80,-120 L80,-120 L70,60 Q60,100 0,110 Q-60,100 -70,60 Z" fill="#eab308"/>
    <!-- Cup handles -->
    <path d="M-80,-100 Q-130,-100 -130,-50 Q-130,0 -80,0" fill="none" stroke="#eab308" stroke-width="20" stroke-linecap="round"/>
    <path d="M80,-100 Q130,-100 130,-50 Q130,0 80,0" fill="none" stroke="#eab308" stroke-width="20" stroke-linecap="round"/>
    <!-- Stem -->
    <rect x="-18" y="110" width="36" height="50" fill="#eab308"/>
    <!-- Base -->
    <rect x="-60" y="155" width="120" height="22" rx="8" fill="#eab308"/>
    <!-- Shine -->
    <ellipse cx="-25" cy="-50" rx="18" ry="35" fill="#fde047" opacity="0.4"/>
  </g>
  <!-- eFL text -->
  <text x="256" y="440" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="88" fill="#eab308" letter-spacing="-2">eFL</text>
</svg>
