<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Фон: тёмный градиент (full-bleed → красиво под любой маской: круг/squircle) -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c22"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <!-- Золото кубка с переливом -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#fef08a"/>
      <stop offset="0.5" stop-color="#eab308"/>
      <stop offset="1"   stop-color="#a16207"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#eab308" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed фон -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Свечение за кубком -->
  <circle cx="256" cy="215" r="180" fill="url(#glow)"/>
  <!-- Тонкое золотое кольцо (безопасная зона маски) -->
  <circle cx="256" cy="256" r="232" fill="none" stroke="#eab308" stroke-opacity="0.12" stroke-width="3"/>

  <!-- Кубок -->
  <g transform="translate(256,165) scale(0.8)">
    <!-- Чаша -->
    <path d="M-78,-110 L78,-110 L68,55 Q58,98 0,108 Q-58,98 -68,55 Z" fill="url(#gold)"/>
    <!-- Ручки -->
    <path d="M-78,-92 Q-126,-92 -126,-46 Q-126,2 -78,2" fill="none" stroke="url(#gold)" stroke-width="19" stroke-linecap="round"/>
    <path d="M78,-92 Q126,-92 126,-46 Q126,2 78,2" fill="none" stroke="url(#gold)" stroke-width="19" stroke-linecap="round"/>
    <!-- Ножка -->
    <rect x="-17" y="108" width="34" height="46" fill="url(#gold)"/>
    <!-- Основание -->
    <rect x="-58" y="150" width="116" height="22" rx="8" fill="url(#gold)"/>
    <!-- Блик -->
    <ellipse cx="-24" cy="-46" rx="15" ry="32" fill="#fffbe6" opacity="0.45"/>
    <!-- Звезда на чаше -->
    <path d="M0,-66 L9,-40 L37,-40 L14,-23 L23,4 L0,-13 L-23,4 L-14,-23 L-37,-40 L-9,-40 Z" fill="#09090b" opacity="0.22"/>
  </g>

  <!-- eFL -->
  <text x="256" y="430" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="86" fill="url(#gold)" letter-spacing="-3">eFL</text>
</svg>
